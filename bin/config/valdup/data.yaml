# Multiflora — variáveis do template.j2 (um top-level key por dispositivo).
# Endereçamento do laboratório "miniarista" (gerência: 10.98.0.0/24):
#   Loopback0 (router-id).......: 10.98.255.1-2/32
#   Enlace P2P (10.98.254.0/24): r1-r2 = .0/30

r1:
  hostname: r1
  interfaces:
    - name: Loopback0
      description: "Loopback (router-id)"
      ip_address: 10.98.255.1
      netmask: 255.255.255.255
    - name: Ethernet1
      description: "P2P para r2 Ethernet1"
      mode: routed
      ip_address: 10.98.254.1
      netmask: 255.255.255.252

r2:
  hostname: r2
  interfaces:
    - name: Loopback0
      description: "Loopback (router-id)"
      ip_address: 10.98.255.2
      netmask: 255.255.255.255
    - name: Ethernet1
      description: "P2P para r1 Ethernet1"
      mode: routed
      ip_address: 10.98.254.2
      netmask: 255.255.255.252
